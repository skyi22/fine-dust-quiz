<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미세먼지 도전! 퀴즈</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf6ff;--card:#fff;--text:#1f2d3d;--sub:#5b6b7c;--main:#2f80ed;--ok:#27ae60;--okbg:#e3f7ea;--no:#e55353;--nobg:#fdeaea;--line:#cfe3f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10202e;--card:#1a2f42;--text:#eef5fb;--sub:#a9bccd;--main:#5aa2ff;--ok:#4fd183;--okbg:#17402b;--no:#ff8080;--nobg:#4a2222;--line:#2c4963}}
:root[data-theme="dark"]{--bg:#10202e;--card:#1a2f42;--text:#eef5fb;--sub:#a9bccd;--main:#5aa2ff;--ok:#4fd183;--okbg:#17402b;--no:#ff8080;--nobg:#4a2222;--line:#2c4963}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:20px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 4px 0 var(--line);text-align:center}
h1{font-size:30px;margin:8px 0}
.big{font-size:64px;line-height:1.1}
p{margin:8px 0}
.sub{color:var(--sub);font-size:17px}
.btn{display:block;width:100%;border:3px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:20px;padding:14px 16px;margin:10px 0;border-radius:18px;cursor:pointer;text-align:left}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--main);border-color:var(--main);color:#fff;text-align:center;font-weight:700}
.btn.c{text-align:center}
.btn.ok{background:var(--okbg);border-color:var(--ok)}
.btn.no{background:var(--nobg);border-color:var(--no)}
.btn:disabled{cursor:default}
a.btn{text-decoration:none}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.q{font-size:23px;font-weight:700;margin:6px 0 12px}
.fb{border-radius:16px;padding:12px 14px;margin-top:10px;text-align:left}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.hide{display:none}
.stars{font-size:44px;letter-spacing:4px}
</style>
</head>
<body>
<div class="wrap">
  <div id="start" class="card">
    <div class="big">😷</div>
    <h1>미세먼지 도전! 퀴즈</h1>
    <p class="sub">영상을 보고, 우리 학년에 맞는 퀴즈에 도전해요!</p>
    <a class="btn c" href="https://youtu.be/XaFE47V_RXg" target="_blank" rel="noopener">▶ 영상 먼저 보기 (유튜브)</a>
    <button class="btn main" data-lv="low">🌱 1~3학년 퀴즈 (8문제)</button>
    <button class="btn main" data-lv="high">🚀 4~6학년 퀴즈 (10문제)</button>
  </div>

  <div id="quiz" class="card hide">
    <div class="bar"><i id="prog"></i></div>
    <div class="sub" id="num"></div>
    <div class="big" id="emoji"></div>
    <div class="q" id="q"></div>
    <div id="opts"></div>
    <div id="fb" class="fb hide"></div>
    <button class="btn main hide" id="next">다음 문제 ➜</button>
  </div>

  <div id="end" class="card hide">
    <div class="stars" id="stars"></div>
    <h1 id="score"></h1>
    <p id="msg"></p>
    <button class="btn main" id="again">다시 도전!</button>
    <button class="btn c" id="home">다른 학년 퀴즈 고르기</button>
    <a class="btn c" href="https://youtu.be/XaFE47V_RXg" target="_blank" rel="noopener">▶ 영상 다시 보기</a>
  </div>
</div>

<script>
const SETS={
low:[
{e:"🌫️",q:"미세먼지는 어떤 먼지일까요?",o:["눈에 잘 안 보일 만큼 아주 작은 먼지","커다란 돌멩이","물방울"],a:0,x:"미세먼지는 머리카락보다 훨씬 작아서 눈으로 잘 보이지 않아요."},
{e:"🔬",q:"미세먼지가 더 위험한 까닭은 무엇일까요?",o:["너무 커서 무거워서","색깔이 예뻐서","작아서 코와 입으로 몸속 깊이 들어가서"],a:2,x:"아주 작아서 몸속 깊이 들어갈 수 있어요."},
{e:"🚗",q:"미세먼지를 만드는 것은 무엇일까요?",o:["자동차 매연과 공장 연기","시원한 바람","맑은 물"],a:0,x:"자동차 매연, 공장 연기 같은 것에서 미세먼지가 많이 나와요."},
{e:"🤧",q:"미세먼지를 많이 마시면 어떻게 될까요?",o:["키가 쑥쑥 자라요","기침이 나고 눈이 따가워요","힘이 세져요"],a:1,x:"기침, 콧물, 눈 따가움이 생길 수 있어요."},
{e:"🏃",q:"미세먼지가 '나쁨'인 날, 밖에서는 어떻게 하면 좋을까요?",o:["신나게 오래 뛰어 논다","마스크를 벗고 논다","밖에 오래 있지 않는다"],a:2,x:"미세먼지가 많은 날은 바깥 활동을 줄이고 실내에서 놀아요."},
{e:"😷",q:"미세먼지 나쁨 날, 밖에 나갈 때 꼭 챙길 것은?",o:["선글라스","보건용 마스크","물놀이 튜브"],a:1,x:"코와 입을 잘 덮는 보건용 마스크를 써요."},
{e:"🧼",q:"밖에서 집에 돌아오면 가장 먼저 무엇을 할까요?",o:["손과 얼굴을 깨끗이 씻는다","그냥 바로 눕는다","옷을 입은 채 이불 속으로 들어간다"],a:0,x:"손과 얼굴을 씻어서 몸에 붙은 먼지를 없애요."},
{e:"🪟",q:"미세먼지가 많은 날, 창문은 어떻게 할까요?",o:["활짝 열어 둔다","하루 종일 열고 잔다","닫아 둔다"],a:2,x:"창문을 닫아서 먼지가 집 안으로 못 들어오게 해요."}
],
high:[
{e:"📏",q:"미세먼지와 초미세먼지를 나누는 기준은 무엇일까요?",o:["색깔","입자의 크기","냄새","나오는 시간"],a:1,x:"지름이 10㎛ 이하면 미세먼지(PM10), 2.5㎛ 이하면 초미세먼지(PM2.5)예요."},
{e:"🔬",q:"초미세먼지(PM2.5)가 미세먼지(PM10)보다 더 조심해야 하는 까닭은?",o:["더 커서 눈에 잘 보여서","더 작아서 폐 깊숙이까지 들어갈 수 있어서","더 무거워서 금방 가라앉아서","냄새가 심해서"],a:1,x:"입자가 작을수록 코와 기관지에서 덜 걸러지고 폐 깊이 들어갈 수 있어요."},
{e:"🏭",q:"사람의 활동으로 미세먼지가 생기는 경우가 아닌 것은?",o:["자동차 배기가스","발전소와 공장의 연료 연소","공사장에서 날리는 먼지","바닷물에서 생기는 소금 입자"],a:3,x:"소금 입자는 자연에서 생기는 먼지예요. 나머지는 사람의 활동에서 나와요."},
{e:"🌪️",q:"자연에서 생기는 미세먼지의 예로 알맞은 것은?",o:["흙먼지(황사)","담배 연기","자동차 매연","쓰레기 태우기"],a:0,x:"황사의 흙먼지, 꽃가루, 바닷물의 소금 등이 자연에서 생겨요."},
{e:"⚗️",q:"공장·자동차에서 나온 오염물질이 공기 중에서 서로 반응해 다시 미세먼지가 되기도 해요. 이 오염물질은?",o:["산소와 질소","황산화물과 질소산화물","수증기와 이산화탄소","헬륨과 네온"],a:1,x:"황산화물(SOx), 질소산화물(NOx) 등이 반응해 미세먼지가 새로 만들어지기도 해요."},
{e:"🫁",q:"미세먼지가 몸에 미치는 영향으로 알맞지 않은 것은?",o:["기침과 목 아픔이 생길 수 있다","눈과 코가 불편해질 수 있다","호흡기 건강이 나빠질 수 있다","폐가 튼튼해진다"],a:3,x:"미세먼지는 호흡기와 눈, 코에 나쁜 영향을 줘요. 오래 많이 마시면 건강에 해로워요."},
{e:"📱",q:"오늘 미세먼지가 얼마나 심한지 알아보려면 어떻게 할까요?",o:["하늘 색만 본다","대기질 예보와 실시간 정보를 확인한다","친구에게 물어본다","어제 날씨를 떠올려 본다"],a:1,x:"미세먼지 예보와 실시간 정보(에어코리아 등)를 확인하고 행동을 정해요."},
{e:"😷",q:"미세먼지를 막으려고 마스크를 쓸 때 알맞은 것은?",o:["천으로 된 일반 마스크가 가장 좋다","보건용 마스크를 얼굴에 틈 없이 잘 맞게 쓴다","마스크는 코 아래로 내려 쓴다","마스크 없이 숨을 참는다"],a:1,x:"KF 표시가 있는 보건용 마스크(KF80, KF94)를 코와 턱까지 틈 없이 써요."},
{e:"🧴",q:"외출하고 돌아온 뒤 해야 할 일로 알맞은 것은?",o:["손, 얼굴, 코를 깨끗이 씻는다","씻지 않고 바로 간식을 먹는다","옷을 털지 않고 침대에 눕는다","창문을 활짝 연다"],a:0,x:"손, 얼굴 등을 씻어 몸에 붙은 먼지를 없애고, 물을 충분히 마셔요."},
{e:"🌍",q:"우리가 미세먼지를 줄이기 위해 실천할 수 있는 일은?",o:["가까운 거리도 차로 이동하기","대중교통, 걷기, 자전거 이용하기","쓰레기를 태워서 없애기","에어컨과 전등을 계속 켜 두기"],a:1,x:"대중교통, 걷기, 자전거를 이용하고 에너지를 아끼면 미세먼지를 줄이는 데 도움이 돼요."}
]};
const $=id=>document.getElementById(id);
let Q=[],lv="low",i=0,score=0,done=false;
function show(id){["start","quiz","end"].forEach(k=>$(k).classList.toggle("hide",k!==id))}
function begin(l){lv=l;Q=SETS[l];i=0;score=0;show("quiz");render()}
function render(){
  const d=Q[i];done=false;
  $("num").textContent=(lv==="low"?"1~3학년":"4~6학년")+" · "+(i+1)+" / "+Q.length;
  $("prog").style.width=(i/Q.length*100)+"%";
  $("emoji").textContent=d.e;$("q").textContent=d.q;
  $("fb").className="fb hide";$("next").classList.add("hide");
  const box=$("opts");box.innerHTML="";
  d.o.forEach((t,n)=>{
    const b=document.createElement("button");b.className="btn";
    b.textContent=["①","②","③","④"][n]+" "+t;
    b.onclick=()=>pick(n);box.appendChild(b);
  });
}
function pick(n){
  if(done)return;done=true;
  const d=Q[i],bs=$("opts").children,right=n===d.a;
  if(right)score++;
  bs[d.a].classList.add("ok");if(!right)bs[n].classList.add("no");
  [...bs].forEach(b=>b.disabled=true);
  const f=$("fb");f.className="fb "+(right?"ok":"no");
  f.textContent=(right?"🎉 정답! ":"💡 아쉬워요! ")+d.x;
  $("next").textContent=i===Q.length-1?"결과 보기 ➜":"다음 문제 ➜";
  $("next").classList.remove("hide");
}
function finish(){
  show("end");
  const r=score/Q.length;
  $("stars").textContent="⭐".repeat(Math.max(1,Math.round(r*3)));
  $("score").textContent=Q.length+"문제 중 "+score+"개 맞혔어요!";
  $("msg").textContent=r>=.85?"미세먼지 박사님이에요! 👏":r>=.5?"잘했어요! 영상을 한 번 더 보면 더 잘할 수 있어요.":"괜찮아요! 영상을 다시 보고 도전해 봐요. 💪";
}
document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>begin(b.dataset.lv));
$("next").onclick=()=>{i++;i<Q.length?render():finish()};
$("again").onclick=()=>begin(lv);
$("home").onclick=()=>show("start");
</script>
</body>
</html>
